<h1>Add resource</h1>
<form method="POST" class="form-card">
  <label>Title <input type="text" name="title" required></label>
  <label>URL <input type="url" name="url" required></label>
  <label>Category (optional) <input type="text" name="category" placeholder="e.g. Git, Web Dev, Design"></label>
  <label>Description (optional) <textarea name="description"></textarea></label>
  <button type="submit" class="btn btn-primary">Add</button>
</form>
