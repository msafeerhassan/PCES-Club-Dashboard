{% extends "base.html" %}
{% block title %}Award: {{ achievement.name }} - PCES{% endblock %}
{% block page_title %}Award "{{ achievement.name }}"{% endblock %}
{% block content %}
<div class="form-panel">
  <form method="POST" class="form-card">
    <label>Member
      <select name="member_id" required>
        {% for m in candidates %}
        <option value="{{ m.id }}">{{ m.name }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Award</button>
      <a href="{{ url_for('achievements.manage') }}" class="btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
