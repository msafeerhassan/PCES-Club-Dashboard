<h1>Gallery management</h1>
<form method="POST" enctype="multipart/form-data">
  <label>Photo: <input type="file" name="photo" required></label>
  <label>Caption: <input type="text" name="caption"></label>
  <button type="submit" class="btn btn-primary">Upload</button>
</form>

<table class="data-table">
  <tr><th>Photo</th><th>Caption</th><th>Uploaded</th><th></th></tr>
  {% for p in photos %}
  <tr>
    <td><img src="{{ p.image_url }}" style="width:100px;"></td>
    <td>{{ p.caption or '-' }}</td>
    <td>{{ p.uploaded_at }}</td>
    <td>
      <form method="POST" action="{{ url_for('gallery.delete_photo', photo_id=p.id) }}" class="inline-form">
        <button type="submit" class="btn btn-small">Delete</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
