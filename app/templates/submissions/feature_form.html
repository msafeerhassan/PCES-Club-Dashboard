<h1>Feature: {{ submission.title }}</h1>

{% if error %}<p style="color:red;">{{ error }}</p>{% endif %}

{% if submission.screenshots %}
<h2>Existing screenshots</h2>
<div style="display:flex; gap:8px; flex-wrap:wrap;">
  {% for s in submission.screenshots %}
  <img src="{{ s.image_url }}" style="width:120px;">
  {% endfor %}
</div>
{% endif %}

<form method="POST" enctype="multipart/form-data">
  <label>Add screenshot(s) — required if none exist yet:
    <input type="file" name="screenshots" multiple accept="image/*">
  </label><br>
  <button type="submit" class="btn btn-primary">Feature this project</button>
</form>
<a href="{{ url_for('submissions.all_submissions') }}">Cancel</a>
