{% extends "base.html" %}
{% block title %}New Announcement - PCES{% endblock %}
{% block page_title %}New announcement{% endblock %}
{% block content %}
<form method="POST" class="form-panel">
  <div class="form-card">
    {% if error %}<p style="color:var(--hc-red); font-weight:700;">{{ error }}</p>{% endif %}

    <label>Title <input type="text" name="title" required></label>
    <label>Body <textarea name="body" required></textarea></label>

    {% if current_user.role.value == 'president' %}
    <label class="dept-picker-item" style="background:var(--fill); border-radius:10px; padding:10px 14px;">
      <input type="checkbox" name="is_club_wide" id="clubWideToggle" onchange="document.getElementById('deptBlock').style.display = this.checked ? 'none' : 'block';">
      This is a club-wide announcement (all departments)
    </label>
    {% endif %}
    <div id="deptBlock">
      <label>Departments
        <div class="dept-picker">
          {% for d in departments %}
          <label class="dept-picker-item">
            <input type="checkbox" name="departments" value="{{ d.id }}">
            {{ d.name }}
          </label>
          {% endfor %}
        </div>
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Post announcement</button>
      <a href="{{ url_for('announcements.list_announcements') }}" class="btn">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
