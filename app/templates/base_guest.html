<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PCES Dashboard{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="guest">
  <script>
    if (localStorage.getItem('pces-theme') === 'dark') { document.body.classList.add('dark-mode'); }
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('pces-theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
  </script>
<main class="guest-content" style="padding:0;">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
